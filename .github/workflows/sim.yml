name: Sim and replays

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      # the .vrp format and the simulation, compiled from the Unity project's sources (Assets/ThirdParty)
      - name: Test
        run: dotnet test sim/ValoReplay.Sim.sln -c Release
      # every published replay must load, be anonymized, be named by its pseudonymous match id and simulate
      - name: Validate published replays
        run: dotnet run --project sim/src/vrpsim -c Release -- validate data/replays
